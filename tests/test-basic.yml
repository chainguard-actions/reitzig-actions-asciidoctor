name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Ruby and Bundler are available
        run: |
          ruby --version || (apt-get update -qq && apt-get install -y -qq ruby ruby-bundler)
          gem --version
          bundle --version || gem install bundler
      - id: action
        uses: .
      - name: Assert asciidoctor is available
        run: |
          echo "Checking asciidoctor is on PATH..."
          if ! command -v asciidoctor >/dev/null 2>&1; then
            echo "asciidoctor not on PATH, checking gem bin..."
            gem environment
            ls "$(gem environment gemdir)/bin/" || true
            # Try adding gem bin to PATH
            export PATH="$(gem environment gemdir)/bin:$PATH"
            if ! command -v asciidoctor >/dev/null 2>&1; then
              echo "FAIL: asciidoctor not found on PATH or gem bin"
              exit 1
            fi
          fi
          echo "PASS: asciidoctor found at $(command -v asciidoctor)"
      - name: Assert asciidoctor version is 2.x
        run: |
          export PATH="$(gem environment gemdir)/bin:$PATH"
          VERSION=$(asciidoctor --version 2>&1 | head -1)
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -qE 'Asciidoctor [2-9]\.'; then
            echo "FAIL: expected asciidoctor 2.x or later, got: $VERSION"
            exit 1
          fi
          echo "PASS: asciidoctor version is 2.x or later"
      - name: Assert asciidoctor can convert a document
        run: |
          export PATH="$(gem environment gemdir)/bin:$PATH"
          echo "= Test Document" > /tmp/test.adoc
          echo "" >> /tmp/test.adoc
          echo "Hello, World!" >> /tmp/test.adoc
          asciidoctor /tmp/test.adoc -o /tmp/test.html
          if [ ! -f /tmp/test.html ]; then
            echo "FAIL: asciidoctor did not produce output file"
            exit 1
          fi
          if ! grep -q "Hello, World!" /tmp/test.html; then
            echo "FAIL: output HTML does not contain expected content"
            exit 1
          fi
          echo "PASS: asciidoctor converted document successfully"
