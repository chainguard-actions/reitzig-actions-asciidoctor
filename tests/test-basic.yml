name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ruby and Bundler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby-full build-essential
          ruby --version
          gem --version
          # Install bundler as root so it's available system-wide
          sudo gem install bundler --no-document
          bundle --version
          # Add system gem bin to PATH
          GEM_BIN=$(ruby -e 'puts Gem.bindir')
          echo "System gem bin: $GEM_BIN"
          echo "$GEM_BIN" >> "$GITHUB_PATH"
          # Ensure bundle installs to system (not local vendor/)
          sudo bundle config set --global path 'false' 2>/dev/null || true
      - id: action
        uses: .
      - name: Assert asciidoctor directory exists
        run: |
          echo "Checking actions_asciidoctor directory..."
          if [ ! -d "$GITHUB_WORKSPACE/actions_asciidoctor" ]; then
            echo "FAIL: actions_asciidoctor directory not found"
            ls -la "$GITHUB_WORKSPACE/" || true
            exit 1
          fi
          echo "PASS: actions_asciidoctor directory found"
          ls -la "$GITHUB_WORKSPACE/actions_asciidoctor/"
      - name: Assert asciidoctor is installed and works
        run: |
          echo "Checking asciidoctor installation..."
          # Try bundle exec in the action's working directory
          VERSION=$(cd "$GITHUB_WORKSPACE/actions_asciidoctor" && bundle exec asciidoctor --version 2>&1 | head -1)
          echo "Version output: $VERSION"
          if echo "$VERSION" | grep -qE 'Asciidoctor [2-9]\.'; then
            echo "PASS: asciidoctor version 2.x or later is installed"
          else
            echo "FAIL: unexpected version output: $VERSION"
            exit 1
          fi
      - name: Assert asciidoctor can convert a document
        run: |
          echo "= Test Document" > /tmp/test.adoc
          echo "" >> /tmp/test.adoc
          echo "Hello, World!" >> /tmp/test.adoc
          cd "$GITHUB_WORKSPACE/actions_asciidoctor"
          bundle exec asciidoctor /tmp/test.adoc -o /tmp/test.html
          if [ ! -f /tmp/test.html ]; then
            echo "FAIL: asciidoctor did not produce output file"
            exit 1
          fi
          if ! grep -q "Hello, World!" /tmp/test.html; then
            echo "FAIL: output HTML does not contain expected content"
            exit 1
          fi
          echo "PASS: asciidoctor successfully converted document"
