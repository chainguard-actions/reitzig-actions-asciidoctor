name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ruby and Bundler
        run: |
          apt-get update -qq && apt-get install -y -qq ruby ruby-dev bundler build-essential || true
          gem install bundler --no-document || true
      - id: action
        uses: .
      - name: Assert asciidoctor is installed
        run: |
          echo "Checking asciidoctor is available..."
          if ! command -v asciidoctor &>/dev/null; then
            echo "FAIL: asciidoctor command not found"
            exit 1
          fi
          echo "PASS: asciidoctor is installed"
      - name: Assert asciidoctor version is 2.x
        run: |
          VERSION=$(asciidoctor --version 2>&1 | head -1)
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -qE 'Asciidoctor 2\.'; then
            echo "FAIL: expected Asciidoctor 2.x, got: $VERSION"
            exit 1
          fi
          echo "PASS: asciidoctor version is 2.x"
      - name: Assert asciidoctor can convert a document
        run: |
          echo "= Hello World" > /tmp/test.adoc
          echo "" >> /tmp/test.adoc
          echo "This is a test document." >> /tmp/test.adoc
          asciidoctor /tmp/test.adoc -o /tmp/test.html
          if [ ! -f /tmp/test.html ]; then
            echo "FAIL: asciidoctor did not produce output file"
            exit 1
          fi
          if ! grep -q "Hello World" /tmp/test.html; then
            echo "FAIL: output HTML does not contain expected content"
            exit 1
          fi
          echo "PASS: asciidoctor converted document successfully"
