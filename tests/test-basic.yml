name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        run: |
          which ruby || sudo apt-get update -qq && sudo apt-get install -y ruby-full ruby-bundler
          ruby --version
          gem --version
          bundle --version || sudo gem install bundler --no-document
          bundle --version
      - id: setup
        uses: .
      - name: Assert asciidoctor is installed
        run: |
          echo "Checking asciidoctor is available..."
          # Try direct command first, then via gem bin path
          if command -v asciidoctor &>/dev/null; then
            echo "PASS: asciidoctor found in PATH"
          elif gem contents asciidoctor 2>/dev/null | grep -q 'bin/asciidoctor'; then
            echo "PASS: asciidoctor installed as gem (may need bundle exec)"
          else
            # Check if it's installed in the bundle
            cd actions_asciidoctor 2>/dev/null || true
            if bundle exec asciidoctor --version &>/dev/null; then
              echo "PASS: asciidoctor available via bundle exec"
            else
              echo "FAIL: asciidoctor not found"
              exit 1
            fi
          fi
      - name: Assert asciidoctor version is 2.x
        run: |
          # Try multiple ways to get the version
          if command -v asciidoctor &>/dev/null; then
            VERSION=$(asciidoctor --version 2>&1 | head -1)
          else
            VERSION=$(cd actions_asciidoctor && bundle exec asciidoctor --version 2>&1 | head -1)
          fi
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -qE 'Asciidoctor [2-9]'; then
            echo "FAIL: expected Asciidoctor 2.x or later, got: $VERSION"
            exit 1
          fi
          echo "PASS: version is 2.x or later"
