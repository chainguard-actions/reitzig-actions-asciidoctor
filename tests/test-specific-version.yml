name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Ruby and Bundler are available
        run: |
          ruby --version || (apt-get update -qq && apt-get install -y -qq ruby ruby-bundler)
          gem install bundler --no-document 2>/dev/null || true
          bundler --version
      - id: setup
        uses: .
        with:
          version: '2.0.20'
      - name: Assert asciidoctor is available
        run: |
          echo "Checking asciidoctor is on PATH or accessible via bundle..."
          if command -v asciidoctor >/dev/null 2>&1; then
            echo "PASS: asciidoctor found at $(command -v asciidoctor)"
          elif bundle exec asciidoctor --version >/dev/null 2>&1; then
            echo "PASS: asciidoctor accessible via bundle exec"
          else
            GEM_BIN=$(gem environment gemdir 2>/dev/null)/bin
            if [ -x "$GEM_BIN/asciidoctor" ]; then
              echo "PASS: asciidoctor found at $GEM_BIN/asciidoctor"
            else
              echo "FAIL: asciidoctor not found"
              exit 1
            fi
          fi
      - name: Assert asciidoctor version is exactly 2.0.20
        run: |
          if command -v asciidoctor >/dev/null 2>&1; then
            VERSION=$(asciidoctor --version 2>&1 | head -1)
          else
            VERSION=$(bundle exec asciidoctor --version 2>&1 | head -1)
          fi
          echo "actual version output: $VERSION"
          if ! echo "$VERSION" | grep -q '2\.0\.20'; then
            echo "FAIL: expected asciidoctor 2.0.20, got: $VERSION"
            exit 1
          fi
          echo "PASS: asciidoctor version is 2.0.20"
