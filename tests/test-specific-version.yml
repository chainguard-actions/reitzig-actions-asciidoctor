name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ruby and Bundler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-bundler
          ruby --version
          bundle --version
      - id: action
        uses: .
        with:
          version: '2.0.22'
      - name: Assert asciidoctor is installed
        run: |
          echo "Checking asciidoctor is on PATH..."
          if ! command -v asciidoctor > /dev/null 2>&1; then
            echo "FAIL: asciidoctor not found on PATH"
            exit 1
          fi
          echo "PASS: asciidoctor is available"
          asciidoctor --version
      - name: Assert asciidoctor version matches requested
        run: |
          VERSION_OUTPUT=$(asciidoctor --version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "2\.0\.22"; then
            echo "FAIL: expected version 2.0.22 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: asciidoctor version 2.0.22 is installed"
