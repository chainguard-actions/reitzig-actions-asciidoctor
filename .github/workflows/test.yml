name: 'Test'

on:
  push:
    branches-ignore:
      - 'wip/*'
    paths-ignore:
      - '**.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - 'ubuntu-latest'
        - 'macos-latest'
        - 'windows-latest'
    steps:
      # Check out; action built on dev machine to `dist/index.js`!
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Run it like we would in the wild:
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: 2.7

      - name: Set up asciidoctor
        uses: ./

      - name: Test
        run: ruby test/run_tests.rb
